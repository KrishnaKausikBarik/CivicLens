<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="referrer" content="no-referrer">
  <title>Reset Password - CivicLens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Urbanist:ital,wght@0,100..900;1,100..900&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body data-page="reset-password">
  <header class="navbar">
    <div class="nav-container">
      <a href="/" class="brand" aria-label="CivicLens home">
        <span class="brand-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
        </span>
        <span class="brand-name">Civic<span>Lens</span></span>
      </a>
      <button class="hamburger-btn" id="mobileMenuBtn" type="button" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="navLinks">
        <svg class="hamburger-icon-open" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
        <svg class="hamburger-icon-close" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <nav class="nav-links" id="navLinks" aria-label="Main navigation">
        <a href="/" class="nav-link">Report Issue</a>
        <a href="/dashboard" class="nav-link">Public Dashboard</a>
        <a href="/?citizen_login=1" class="nav-link nav-btn-outline">Citizen Login</a>
      </nav>
    </div>
  </header>

  <main class="hero-section reset-page-main">
    <section class="modal-card modal-sm reset-password-card" aria-labelledby="resetPasswordTitle">
      <div class="modal-header reset-password-header">
        <div class="modal-title-wrap">
          <span class="reset-password-icon" aria-hidden="true">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <h1 class="modal-title" id="resetPasswordTitle">Create New Password</h1>
        </div>
      </div>
      <div class="modal-body reset-password-body">
        <p class="modal-subtitle reset-instruction">Enter your new password below.</p>
        <p id="resetPasswordStatus" class="modal-subtitle reset-status" role="status" aria-live="polite">Checking your reset link…</p>
        <form id="resetPasswordForm" hidden>
          <div class="form-group">
            <label class="form-label" for="newPassword">New Password</label>
            <input type="password" id="newPassword" class="form-control" autocomplete="new-password" minlength="8" maxlength="256" aria-describedby="passwordGuidance" required>
            <button type="button" class="btn-link password-visibility-toggle" data-toggle-password="newPassword" aria-pressed="false">Show password</button>
            <p class="password-guidance" id="passwordGuidance">Use at least 8 characters. A longer, unique passphrase is stronger.</p>
          </div>
          <div class="form-group">
            <label class="form-label" for="confirmNewPassword">Confirm Password</label>
            <input type="password" id="confirmNewPassword" class="form-control" autocomplete="new-password" minlength="8" maxlength="256" required>
            <button type="button" class="btn-link password-visibility-toggle" data-toggle-password="confirmNewPassword" aria-pressed="false">Show password</button>
          </div>
          <button type="submit" class="btn btn-primary btn-block reset-submit-button">Reset Password</button>
        </form>
        <div id="resetPasswordDone" class="reset-password-done" hidden>
          <p class="reset-success-note">Your password has been updated. Redirecting you to login…</p>
        </div>
        <p class="reset-login-return"><a href="/?citizen_login=1">Return to login</a></p>
      </div>
    </section>
  </main>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
