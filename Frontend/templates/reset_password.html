<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Reset Password - CivicLens</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body data-page="reset-password">
  <main class="modal-backdrop open" role="main">
    <section class="modal-card modal-sm" aria-labelledby="resetPasswordTitle">
      <div class="modal-header">
        <div class="modal-title-wrap"><h1 class="modal-title" id="resetPasswordTitle">Create a new password</h1></div>
      </div>
      <div class="modal-body">
        <p class="modal-subtitle">Choose a new password for your CivicLens account.</p>
        <p id="resetPasswordStatus" class="form-error" role="status" aria-live="polite">Checking your reset link…</p>
        <form id="resetPasswordForm" hidden>
          <div class="form-group">
            <label class="form-label" for="newPassword">New password</label>
            <input type="password" id="newPassword" class="form-control" autocomplete="new-password" minlength="8" maxlength="256" required>
            <button type="button" class="btn-link" data-toggle-password="newPassword" aria-pressed="false">Show password</button>
          </div>
          <div class="form-group">
            <label class="form-label" for="confirmNewPassword">Confirm password</label>
            <input type="password" id="confirmNewPassword" class="form-control" autocomplete="new-password" minlength="8" maxlength="256" required>
            <button type="button" class="btn-link" data-toggle-password="confirmNewPassword" aria-pressed="false">Show password</button>
          </div>
          <button type="submit" class="btn btn-primary">Reset Password</button>
        </form>
        <p id="resetPasswordDone" hidden><a class="btn-link" href="/">Back to CivicLens login</a></p>
      </div>
    </section>
  </main>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
