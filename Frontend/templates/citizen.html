<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <title>CivicLens - My Complaints</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Urbanist:ital,wght@0,100..900;1,100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body data-page="citizen">
  <header class="navbar">
    <div class="nav-container">
      <a href="/" class="brand"><span class="brand-name">Civic<span>Lens</span></span></a>
      <nav class="nav-links">
        <a href="/" class="nav-link">Report Issue</a>
        <a href="/dashboard" class="nav-link">Public Dashboard</a>
        <button type="button" id="citizenLogoutBtn" class="btn btn-secondary btn-sm">Log out</button>
      </nav>
    </div>
  </header>
  <section class="dashboard-header-bar">
    <div class="main-container">
      <div class="flex-between align-center dashboard-header-content">
        <div class="dashboard-header-text"><h1 class="page-title">My Complaints</h1><p class="page-description">Track the complaints submitted from your CivicLens account.</p></div>
        <a href="/#report-section" class="btn btn-primary">Submit a Complaint</a>
      </div>
    </div>
  </section>
  <main class="main-container">
    <section class="card section-margin-top">
      <div class="card-header"><h2 class="card-title" id="citizenWelcome">Your complaint history</h2></div>
      <div class="table-responsive"><table class="data-table">
        <thead><tr><th>Complaint ID</th><th>Title</th><th>Category</th><th>Submission Date</th><th>Location</th><th>Status</th></tr></thead>
        <tbody id="citizenReportsBody"><tr><td colspan="6" class="text-center py-4">Loading your complaints…</td></tr></tbody>
      </table></div>
    </section>
    <section class="card section-margin-top">
      <div class="card-header"><h2 class="card-title">Your complaint locations</h2></div>
      <div id="citizenReportsMap" class="map-container-lg"></div>
    </section>
  </main>
  <div id="toastNotification" class="toast-toast" aria-live="polite"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="{{ url_for('static', filename='js/map.js') }}"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
